<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>球员档案 · 球员挖掘系统</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="nav"></div>

<section class="wrap section" id="main">
  <div class="empty"><span class="spinner"></span> 载入球员档案…</div>
</section>

<div id="foot"></div>
<script src="assets/js/common.js"></script>
<script>
renderNav('player.html');

const id = new URLSearchParams(location.search).get('id');

function fieldRow(label, v, kind, tip) {
  return `<tr><th style="width:110px">${esc(label)}</th><td>${v}${kind ? src(kind, tip || '') : ''}</td></tr>`;
}

function riskLevel(p) {
  const risks = [];
  let score = 0;
  if (p.age == null) { risks.push('出生日期缺失，无法评估年龄与成长曲线'); score += 25; }
  else {
    if (p.age >= 33) { risks.push(`年龄 ${p.age} 岁，已过该位置常规巅峰期，转售价值与伤病风险上升`); score += 30; }
    else if (p.age >= 31) { risks.push(`年龄 ${p.age} 岁，接近巅峰期末段`); score += 15; }
    else if (p.age <= 19) { risks.push(`年龄 ${p.age} 岁，职业样本量有限，存在成材不确定性`); score += 12; }
  }
  if (!p.positionRaw) { risks.push('数据源未提供位置信息，战术适配为保守估值'); score += 20; }
  if (!p.team) { risks.push('数据源未提供现所属俱乐部'); score += 15; }
  if (!p.nationalityEn) { risks.push('国籍信息缺失'); score += 8; }
  if (p.signingFee && /free|免费/i.test(p.signingFee)) risks.push('最近一次为自由转会加盟');
  const level = score >= 40 ? ['高', 'err'] : score >= 20 ? ['中', 'warn'] : ['低', 'ok'];
  return { level: level[0], cls: level[1], score, risks };
}

(async () => {
  const main = document.getElementById('main');
  if (!id) {
    main.innerHTML = '<div class="empty"><h3>未指定球员</h3><p class="muted"><a href="scout.html">前往智能挖掘</a> 选择球员</p></div>';
    return;
  }
  /* 默认实时联网取数：直接向数据源请求当前值，不使用本地缓存副本 */
  const liveOnly = new URLSearchParams(location.search).get('live') !== '0';
  let r;
  try { r = await api.get('/api/player?id=' + q(id) + (liveOnly ? '&live=1' : '')); }
  catch (e) { main.innerHTML = '<div class="empty"><h3>读取失败</h3><p class="muted">' + esc(e.message) + '</p></div>'; return; }

  const p = r.player, fit = r.fit;
  const P = await loadProfile();
  const risk = riskLevel(p);

  const img = p.image ? `<img src="${esc(p.image)}" alt="" style="width:112px;height:112px;border-radius:50%;object-fit:cover;background:#e8e8ed">`
    : `<div style="width:112px;height:112px;border-radius:50%;background:#e8e8ed"></div>`;

  /* 数据完整度：统计真实字段的缺失情况 */
  const fields = [
    ['姓名', p.name], ['位置', p.positionRaw], ['出生日期', p.birthDate], ['国籍', p.nationalityEn],
    ['俱乐部', p.team], ['联赛', p.league], ['球衣号', p.number], ['签约日期', p.signedDate]
  ];
  const missing = fields.filter(f => !f[1]).map(f => f[0]);

  main.innerHTML = `
  <div class="between">
    <div class="row" style="gap:20px">
      ${img}
      <div>
        <div class="eyebrow">球员档案 · 真实数据</div>
        <h1>${esc(p.name || '未知球员')}</h1>
        <div class="row mt8" style="gap:6px">
          <span class="badge">${esc(p.positionCn || '位置未知')}</span>
          <span class="badge">${p.age != null ? p.age + ' 岁' : '年龄未知'}</span>
          <span class="badge">${esc(p.nationality || '国籍未知')}</span>
          ${p.team ? `<span class="badge info">${esc(p.team)}</span>` : ''}
          ${p.leagueCn ? `<span class="badge tier">${esc(p.leagueCn)}</span>` : ''}
          ${liveBadge(r.dataMode, r.fetchedAt, r.error)}
        </div>
        <div class="small muted mt8">来源 ${esc(p.source)} · 抓取时间 ${new Date(p.fetchedAt || Date.now()).toLocaleString('zh-CN')}</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="liveBtn" title="重新向数据源发起一次真实请求，取回当前最新值">重新联网获取</button>
      <button class="btn" id="addBtn">加入目标清单</button>
      <a class="btn ghost" href="deal.html?id=${esc(p.id)}">转会测算</a>
    </div>
  </div>

  ${r.dataMode === 'cached' ? `<div class="note warn">本次联网失败（${esc(r.error || '数据源限流或超时')}），以下为上次联网获取的真实数据，未做任何估算填充。</div>` : ''}
  ${r.dataMode === 'live' ? `<div class="note ok">以上字段为本次请求实时联网取回的数据源当前值。</div>` : ''}

  <div class="grid g2 mt32" style="align-items:start">
    <div class="card">
      <h3>基础信息</h3>
      <table class="table mt8">
        ${fieldRow('姓名', val(p.name), 'real')}
        ${fieldRow('别名', val(p.nameAlt), 'real')}
        ${fieldRow('位置', val(p.positionCn) + (p.positionRaw ? `<span class="muted small">　${esc(p.positionRaw)}</span>` : ''), 'real')}
        ${fieldRow('出生日期', val(p.birthDate), 'real')}
        ${fieldRow('年龄', val(p.age, ' 岁'), 'real')}
        ${fieldRow('国籍', val(p.nationality), 'real')}
        ${fieldRow('出生地', val(p.birthLocation), 'real')}
        ${fieldRow('现所属', val(p.team), 'real')}
        ${fieldRow('联赛', val(p.leagueCn || p.league), 'real')}
        ${fieldRow('球衣号', val(p.number), 'real')}
        ${fieldRow('签约日期', val(p.signedDate), 'real')}
        ${fieldRow('加盟方式', val(p.signingFee), 'real')}
        ${fieldRow('国家队', p.nationalTeam ? '<span class="badge ok">现役国脚</span>' : NA, 'real')}
        ${fieldRow('身高', val(p.height, ' cm'), 'real')}
        ${fieldRow('体重', val(p.weight, ' kg'), 'real')}
        ${fieldRow('出生地', val(p.birthPlace || p.birthLocation), 'real')}
        ${fieldRow('加盟日期', val(p.joinDate), 'real')}
        ${fieldRow('官方出场数', val(p.appearances, ' 场'), 'real')}
        ${fieldRow('零封 / 扑救', p.cleanSheets != null || p.saves != null
          ? val(p.cleanSheets, ' 零封') + '　' + val(p.saves, ' 次扑救') : NA, 'real')}
        ${fieldRow('租借身份', p.loan == null ? NA : (p.loan ? '<span class="badge info">租借在队</span>' : '<span class="badge">永久在队</span>'), 'real')}
        ${fieldRow('身价', NA + '<div class="small muted">德转无开放接口且有反爬校验，无法抓取，故不显示</div>', 'none')}
        ${fieldRow('周薪 / 年薪', NA + '<div class="small muted">非公开商业信息，无权威公开源</div>', 'none')}
        ${fieldRow('合同到期', NA + '<div class="small muted">无开放数据源</div>', 'none')}
        ${fieldRow('伤病记录', NA + '<div class="small muted">无开放数据源，不做推测</div>', 'none')}
      </table>
      ${p.seasonStats ? `<div class="note mt16"><b>赛季技术统计（${esc(p.seasonStatsLabel || '')}）</b>
        <div class="small mt8">${Object.entries(p.seasonStats).slice(0, 12).map(([k, v]) => k + ': ' + v).join('　·　')}</div></div>` : ''}
    </div>

    <div>
      <div class="card">
        <h3>体系适配度 <span class="muted small">（模型计算）</span></h3>
        <div class="small muted mt8">依据画像：${esc(P.formation)} · ${STYLE_CN[P.style] || P.style} · 压迫 ${P.press}/5</div>
        ${fit ? `
          <div class="row mt16" style="gap:20px;align-items:center">
            <div><div class="metric">${fit.total != null ? fit.total : '—'}</div><div class="metric-note">综合适配度</div></div>
            <div style="flex:1;min-width:160px">
              <div class="small muted">结果置信度 ${fit.confidence}%</div>
              <div class="bar mt8"><i style="width:${fit.confidence}%"></i></div>
              <div class="small muted mt8">置信度 = 已有数据维度权重占比</div>
            </div>
          </div>
          <div class="mt24">
            ${[['技术适配', fit.dims.tech, '位置契合 + 联赛竞技水平'],
               ['战术适配', fit.dims.tact, '打法风格 × 位置角色'],
               ['风格适配', fit.dims.style, '年龄曲线 vs 建队取向'],
               ['薪资适配', fit.dims.salary, '需薪资数据源']].map(([k, v, d]) => `
              <div class="dim">
                <div class="dim-head"><span>${k} ${src(v == null ? 'none' : 'model', d)}</span>
                  <span class="v">${v == null ? '暂无数据' : Math.round(v)}</span></div>
                <div class="bar"><i style="width:${v == null ? 0 : Math.max(2, Math.min(100, v))}%;background:${v == null ? '#d2d2d7' : 'var(--blue)'}"></i></div>
                <div class="small muted mt8" style="font-size:11.5px">${d}</div>
              </div>`).join('')}
          </div>
          ${fit.gaps && fit.gaps.length ? `<div class="note mt16"><b>数据缺口</b><ul style="margin:6px 0 0 18px;padding:0">${fit.gaps.map(g => '<li>' + esc(g) + '</li>').join('')}</ul></div>` : ''}
        ` : `<div class="note mt16">尚未配置战术画像，<a href="tactical.html">先完成体系配置</a>后即可生成适配度。</div>`}
      </div>

      <div class="card mt16">
        <h3>风险画像</h3>
        <div class="row mt16" style="gap:16px">
          <span class="badge ${risk.cls}" style="font-size:13px;padding:5px 14px">风险等级：${risk.level}</span>
          <span class="small muted">风险分 ${risk.score} / 100（基于真实字段推导）</span>
        </div>
        <ul class="small mt16" style="margin:0;padding-left:18px;line-height:1.8">
          ${risk.risks.length ? risk.risks.map(x => '<li>' + esc(x) + '</li>').join('') : '<li>未发现基于现有数据的风险项</li>'}
        </ul>
        <div class="note gray mt16">伤病历史、纪律记录、职业态度等维度需接入专业数据源后补充，当前不做推测。</div>
      </div>
    </div>
  </div>

  <div class="grid g2 mt16" style="align-items:start">
    <div class="card">
      <h3>数据溯源与交叉核对</h3>
      <p class="small muted mt8">以下为数据源提供的外部权威编号，可跳转原站人工复核，确保数据可验证、不可篡改。</p>
      <table class="table mt8">
        ${fieldRow('数据源', esc(p.source), 'real')}
        ${fieldRow('数据源页', p.sourceUrl ? `<a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">打开原始记录</a>` : NA, 'real')}
        ${fieldRow('Transfermarkt ID', val(p.transfermarktId), 'real')}
        ${fieldRow('API-Football ID', val(p.apiFootballId), 'real')}
        ${fieldRow('Wikidata ID', val(p.wikidataId), 'real')}
      </table>
      <div class="note gray mt16">缺失字段 ${missing.length ? '：<b>' + esc(missing.join('、')) + '</b>' : '：无'}。系统对缺失字段统一留空，不做填充。</div>
    </div>
    <div class="card">
      <h3>球员简介</h3>
      <div class="small mt8" style="max-height:260px;overflow:auto;line-height:1.7">
        ${p.description ? esc(p.description).replace(/\r?\n/g, '<br>') : '<span class="muted">数据源未提供简介</span>'}
      </div>
      ${p.description ? `<div class="small muted mt8">以上内容来自数据源原文，未经改写</div>` : ''}
    </div>
  </div>

  <div class="card mt16">
    <h3>懂球帝资料 <span class="muted small">（实时联网 · 中文名 / 转会 / 伤病 / 赛季数据 / 技术特点）</span></h3>
    <p class="small muted mt8">懂球帝（dongqiudi.com）是国内足球数据平台。以下字段从其球员详情接口实时抓取，缺则留空、绝不编造；未收录球员请手动输入其懂球帝 person_id 查询。</p>
    <div id="dqdBox" class="mt8"><span class="muted">加载中…</span></div>
  </div>

  <div class="card mt16">
    <h3>权威核对入口 <span class="muted small">（身价 / 薪资 / 伤病请在此核对）</span></h3>
    <p class="small muted mt8">身价、薪资、伤病这三类数据没有任何开放接口，系统不抓取、不估算。以下为该球员在权威站点的直达入口，可人工核对最新值。</p>
    <div id="authBox" class="mt8"><span class="muted">加载中…</span></div>
  </div>

  <div class="card mt16">
    <h3>相似球员（以人找人）</h3>
    <div id="simBox" class="mt8 small muted">加载中…</div>
  </div>
  `;

  /* 懂球帝资料（实时联网，按英文名映射 person_id；未收录则提示手动查询） */
  (async () => {
    const box = document.getElementById('dqdBox');
    if (!box) return;
    const renderDqd = (d) => {
      const marketYears = d.marketHistory && typeof d.marketHistory === 'object' ? Object.keys(d.marketHistory) : [];
      const latestMarket = marketYears.length ? (() => {
        const y = marketYears[marketYears.length - 1];
        const arr = d.marketHistory[y];
        const last = Array.isArray(arr) && arr.length ? arr[arr.length - 1] : null;
        return last && (last.market_value_text || (last.market_value != null ? last.market_value + ' 万欧' : null));
      })() : null;
      const charRows = [];
      if (d.character) {
        const st = (d.character.styles || []).join('、');
        const strong = ((d.character.strength && d.character.strength.strong) || []).concat((d.character.strength && d.character.strength.very_strong) || []);
        const weak = ((d.character.weakness && d.character.weakness.weak) || []).concat((d.character.weakness && d.character.weakness.very_weak) || []);
        if (st) charRows.push(`<div class="small"><b>风格</b>：${esc(st)}</div>`);
        if (strong.length) charRows.push(`<div class="small"><b>强项</b>：${esc(strong.join('、'))}</div>`);
        if (weak.length) charRows.push(`<div class="small"><b>弱项</b>：${esc(weak.join('、'))}</div>`);
      }
      const transferRows = (d.transferHistory || []).slice().reverse().map(t =>
        `<tr><td class="nowrap small">${esc(t.date || '—')}</td><td class="small">${esc(t.from || '—')} → ${esc(t.to || '—')}</td><td class="small nowrap">${esc(t.fee ? t.fee + ' 万欧' : (t.type || ''))}</td></tr>`).join('');
      const injuryRows = (d.injuryHistory || []).map(x =>
        `<tr><td class="small">${esc(x.injury || '—')}</td><td class="nowrap small">${esc(x.dateFrom || '')} ~ ${esc(x.dateUntil || '')}</td>
        <td class="num small">${x.days != null ? x.days + ' 天' : '—'}</td><td class="num small">${x.gamesMissed != null ? x.gamesMissed + ' 场' : '—'}</td>
        <td class="small">${esc((x.teams || []).join('、'))}</td></tr>`).join('');
      const seasonRows = (d.careerSeasons || []).map(c =>
        `<tr><td class="small">${esc(c.team || '—')}</td><td class="nowrap small">${esc(c.startDate || '')} ~ ${esc(c.endDate || '')}</td>
        <td class="num small">${c.appearance != null ? c.appearance : '—'}</td><td class="num small">${c.goals != null ? c.goals : '—'}</td>
        <td class="num small">${c.assist != null ? c.assist : '—'}</td><td class="num small">${c.cleanSheets != null ? c.cleanSheets : '—'}</td></tr>`).join('');

      box.innerHTML = `
        <div class="row mt8" style="gap:8px;flex-wrap:wrap">
          ${d.nameCn ? `<span class="badge info">中文名：${esc(d.nameCn)}</span>` : ''}
          ${d.nationality ? `<span class="badge">${esc(d.nationality)}</span>` : ''}
          ${d.teamCn ? `<span class="badge tier">${esc(d.teamCn)}</span>` : ''}
          ${d.marketValueWan != null ? `<span class="badge">身价 ${esc((d.marketValueWan / 10000).toFixed(2))} 亿欧</span>` : ''}
          ${d.weeklySalary != null ? `<span class="badge">周薪 ${esc(d.weeklySalary)}</span>` : ''}
          ${d.contractUntil ? `<span class="badge">合同至 ${esc(d.contractUntil)}</span>` : ''}
          ${d.sourceUrl ? `<a class="btn ghost sm" href="${esc(d.sourceUrl)}" target="_blank" rel="noopener">懂球帝原始页 ↗</a>` : ''}
        </div>
        ${d.character || charRows.length ? `<div class="card mt12" style="background:var(--panel2,#f6f6f8)"><h4 class="small">技术特点</h4><div class="mt8" style="line-height:1.8">${charRows.join('') || '<span class="muted small">无</span>'}</div></div>` : ''}
        ${(d.transferHistory && d.transferHistory.length) ? `<div class="mt12"><b class="small">转会记录</b><div class="tbl-scroll mt8"><table class="table"><thead><tr><th>日期</th><th>去向</th><th>费用</th></tr></thead><tbody>${transferRows}</tbody></table></div></div>` : ''}
        ${(d.careerSeasons && d.careerSeasons.length) ? `<div class="mt12"><b class="small">每个赛季基本数据</b><div class="tbl-scroll mt8"><table class="table"><thead><tr><th>球队</th><th>起止</th><th>出场</th><th>进球</th><th>助攻</th><th>零封</th></tr></thead><tbody>${seasonRows}</tbody></table></div></div>` : ''}
        ${(d.injuryHistory && d.injuryHistory.length) ? `<div class="mt12"><b class="small">伤病记录</b><div class="tbl-scroll mt8"><table class="table"><thead><tr><th>伤情</th><th>起止</th><th>缺席天数</th><th>缺阵场次</th><th>球队</th></tr></thead><tbody>${injuryRows}</tbody></table></div></div>` : '<div class="small muted mt12">伤病记录：暂无</div>'}
        ${marketYears.length ? `<div class="small muted mt12">历年身价（${esc(marketYears.length)} 个年度，最新 ${esc(latestMarket || '—')}）</div>` : ''}
      `;
    };

    try {
      const r = await api.get('/api/dqd/person?name=' + q(p.name));
      if (r.player) renderDqd(r.player);
    } catch (e) {
      box.innerHTML = `<div class="note gray mt8">
        未收录该球员的懂球帝 person_id，或联网失败。<br>
        <span class="muted">懂球帝搜索接口需登录态，无法自动按名匹配。可到 <a href="https://www.dongqiudi.com" target="_blank" rel="noopener">懂球帝</a> 找到球员页，把网址末尾数字填入下方查询：</span>
        <div class="row mt8" style="gap:8px">
          <input id="dqdIdInput" class="input" style="max-width:180px" placeholder="如 50466810">
          <button class="btn sm" id="dqdLookup">查询</button>
        </div>
      </div>`;
      const inp = document.getElementById('dqdIdInput');
      const btn = document.getElementById('dqdLookup');
      if (inp && btn) btn.addEventListener('click', async () => {
        const v = (inp.value || '').trim();
        if (!v) return;
        btn.disabled = true; btn.textContent = '查询中…';
        try { const r2 = await api.get('/api/dqd/person?dqdId=' + q(v)); if (r2.player) renderDqd(r2.player); }
        catch (e2) { box.innerHTML = '<span class="muted">查询失败：' + esc(e2.message) + '</span>'; }
        btn.disabled = false; btn.textContent = '查询';
      });
    }
  })();

  /* 权威来源链接 */
  (async () => {
    try {
      const a = await api.get('/api/authority?id=' + q(p.id));
      document.getElementById('authBox').innerHTML =
        `<div class="row" style="gap:8px">` + a.links.map(l =>
          `<a class="btn ghost sm" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.note || '')}">${esc(l.label)} ↗</a>`
        ).join('') + `</div>
         <div class="small muted mt8">${a.links.map(l => '· ' + esc(l.label) + '：' + esc(l.note || '')).join('<br>')}</div>`;
    } catch (e) {
      const b = document.getElementById('authBox');
      if (b) b.innerHTML = '<span class="muted">加载失败：' + esc(e.message) + '</span>';
    }
  })();

  const liveBtn = document.getElementById('liveBtn');
  if (liveBtn) liveBtn.addEventListener('click', async () => {
    liveBtn.disabled = true; liveBtn.textContent = '联网获取中…';
    try { await api.get('/api/live/player?id=' + q(p.id)); location.reload(); }
    catch (e) { liveBtn.disabled = false; liveBtn.textContent = '重新联网获取'; alert('联网获取失败：' + e.message); }
  });

  document.getElementById('addBtn').addEventListener('click', async () => {
    const b = document.getElementById('addBtn');
    try {
      await api.post('/api/targets', { target: { id: p.id, name: p.name, level: 'B', stage: '初步接触', note: '' } });
      b.textContent = '已加入目标清单'; b.classList.add('gray');
    } catch (e) { alert('加入失败：' + e.message); }
  });

  try {
    const s = await api.get('/api/similar?id=' + q(p.id) + '&limit=6');
    document.getElementById('simBox').innerHTML = s.list.length
      ? `<div class="tbl-scroll"><table class="table"><tbody>${s.list.map(x => `
          <tr><td>${playerRow(x)}</td><td class="nowrap small">${esc(x.positionCn)}</td>
          <td class="num small">${val(x.age)}</td><td>${scoreBar(x.similarity)}</td>
          <td><a class="btn ghost sm" href="player.html?id=${esc(x.id)}">查看</a></td></tr>`).join('')}
        </tbody></table></div>`
      : '<span class="muted">库中暂无可比对的球员</span>';
  } catch (e) { document.getElementById('simBox').textContent = '加载失败'; }
})();
</script>
</body>
</html>
