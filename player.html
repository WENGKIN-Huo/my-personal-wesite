<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>球员档案 · 球员挖掘系统</title>
<style>
/* ============================================================
   足球球员挖掘系统 —— 视觉规范
   风格参考：Apple 官网 —— 极简、大留白、无边框噪点、克制的强调色
   ============================================================ */
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --muted-2: #86868b;
  --line: #d2d2d7;
  --line-soft: #e8e8ed;
  --blue: #0071e3;
  --blue-soft: #e8f2fe;
  --green: #248a3d;
  --green-soft: #e3f5e8;
  --orange: #c2700b;
  --orange-soft: #fdf1e0;
  --red: #d70015;
  --red-soft: #ffe9ec;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
  --nav-h: 52px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text", "PingFang SC",
               "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  letter-spacing: .01em;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: 40px; line-height: 1.1; }
h2 { font-size: 28px; line-height: 1.15; }
h3 { font-size: 20px; }
p { margin: 0; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------------- 导航 ---------------- */
.nav {
  position: sticky; top: 0; z-index: 100;
  height: var(--nav-h);
  background: rgba(255,255,255,.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line-soft);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto; height: 100%;
  display: flex; align-items: center; gap: 28px; padding: 0 24px;
}
.nav-brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.nav-links { display: flex; gap: 24px; overflow-x: auto; flex: 1; }
.nav-links a {
  color: var(--text); font-size: 13px; opacity: .8; white-space: nowrap; padding: 4px 0;
  border-bottom: 2px solid transparent;
}
.nav-links a:hover { text-decoration: none; opacity: 1; }
.nav-links a.active { opacity: 1; font-weight: 600; border-bottom-color: var(--blue); }
.nav-status { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* ---------------- 布局 ---------------- */
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.section { padding-top: 56px; padding-bottom: 8px; }
.section.tight { padding-top: 28px; }
.eyebrow { font-size: 13px; color: var(--blue); font-weight: 600; margin-bottom: 8px; }
.lede { font-size: 18px; color: var(--muted); margin-top: 12px; max-width: 760px; line-height: 1.5; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .g3, .g4 { grid-template-columns: repeat(2, 1fr); } .g2 { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } h1 { font-size: 30px; } h2 { font-size: 22px; } }

/* ============================================================
   移动端适配（手机 / 小屏）
   目标：触控友好（≥44px 触控目标）、单列布局、表格可横向滑动、
        导航横向滚动、内容不溢出。
   ============================================================ */
@media (max-width: 720px) {
  :root { --nav-h: 52px; }

  /* 基础排版 */
  body { font-size: 15px; }
  h1 { font-size: 27px; line-height: 1.2; }
  h2 { font-size: 21px; }
  h3 { font-size: 17px; }

  /* 容器留白收紧，给手机更多内容空间 */
  .wrap { padding: 0 16px; }
  .section { padding-top: 32px; padding-bottom: 6px; }
  .section.tight { padding-top: 18px; }
  .lede { font-size: 16px; }

  /* 卡片：内边距收紧、圆角略小 */
  .card { padding: 18px; border-radius: 16px; }
  .metric { font-size: 28px; }

  /* ------- 导航：横向滚动标签栏 ------- */
  .nav { height: auto; min-height: var(--nav-h); }
  .nav-inner {
    gap: 10px; padding: 8px 16px 0; height: auto;
    flex-wrap: wrap; align-items: center;
  }
  .nav-brand { font-size: 15px; padding: 6px 0; }
  .nav-status { display: none; }        /* 手机隐藏右上角实时统计，避免挤占 */
  .nav-links {
    width: 100%; gap: 20px; padding: 2px 0 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    flex: none;
  }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a { font-size: 15px; padding: 8px 2px; }

  /* ------- 按钮：加大触控目标 ------- */
  .btn { min-height: 44px; padding: 11px 20px; font-size: 15px; }
  .btn.sm { min-height: 36px; padding: 7px 14px; font-size: 13.5px; }
  .btn-row { gap: 10px; }
  .btn-row .btn { flex: 1 1 auto; text-align: center; }
  .btn-row .btn.ghost { flex: 0 1 auto; }

  /* ------- 表单控件：防 iOS 缩放、加高输入区 ------- */
  input[type=text], input[type=number], input[type=search], select, textarea {
    font-size: 16px;                      /* ≥16px 防 iOS 聚焦自动放大 */
    padding: 12px 14px;
  }
  .field label { font-size: 13px; }
  .filters { grid-template-columns: 1fr 1fr; gap: 10px; }
  .filters .field:first-child { grid-column: 1 / -1; }

  /* ------- 表格：容器横向滑动 + 缩小字号 ------- */
  .table, .tbl { font-size: 13px; }
  .table th, .table td, .tbl th, .tbl td { padding: 9px 10px; }
  .tbl-scroll, .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tbl-scroll .table, .table-wrap .tbl { min-width: 560px; }   /* 保证宽表可横向滑动而非被压扁 */

  /* ------- 行内元素换行 ------- */
  .between { flex-direction: column; align-items: flex-start; gap: 10px; }
  .between .btn-row, .between .row { width: 100%; }

  /* ------- 徽章字号 ------- */
  .badge { font-size: 11px; padding: 3px 10px; }

  /* ------- 覆盖条：窄屏下收紧左侧标签列 ------- */
  .cov-row { grid-template-columns: 92px 1fr 46px; gap: 8px; font-size: 12.5px; }

  /* ------- 球场阵型：全宽自适应，缩小球点 ------- */
  .slot .dot { width: 30px; height: 30px; font-size: 10px; }
  .slot .lbl { font-size: 9px; }

  /* ------- 分栏（player.html 头部等） ------- */
  .btn-row { width: 100%; }

  /* ------- 页脚 ------- */
  .foot { margin-top: 40px; padding: 20px 0 36px; }

  /* ------- 分段控件（联赛切换）横向可滚 ------- */
  #leagueSeg { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #leagueSeg .seg { flex: none; }
}

/* 超窄屏（≤380px，老款手机）再收紧 */
@media (max-width: 380px) {
  h1 { font-size: 24px; }
  .card { padding: 16px; }
  .wrap { padding: 0 12px; }
  .filters { grid-template-columns: 1fr; }
  .filters .field:first-child { grid-column: auto; }
  .nav-inner { padding: 0 12px; }
}

/* ---------------- 卡片 ---------------- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow);
}
.card.flat { box-shadow: none; border: 1px solid var(--line-soft); }
.card-title { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.metric { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.metric.sm { font-size: 24px; }
.metric-note { font-size: 12px; color: var(--muted-2); margin-top: 4px; }

/* ---------------- 表单 ---------------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
input[type=text], input[type=number], input[type=search], select, textarea {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  background: #fff; outline: none; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,113,227,.15); }
.filters { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }

.btn {
  border: none; border-radius: 980px; padding: 9px 18px; font-size: 14px; font-weight: 500;
  background: var(--blue); color: #fff; cursor: pointer; transition: .15s;
}
.btn:hover { background: #0077ed; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--blue); border: 1px solid var(--blue); }
.btn.ghost:hover { background: var(--blue-soft); }
.btn.gray { background: #e8e8ed; color: var(--text); }
.btn.gray:hover { background: #dcdce1; }
.btn.sm { padding: 6px 14px; font-size: 13px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* 分段控件 */
.seg { display: inline-flex; background: #e8e8ed; border-radius: 980px; padding: 2px; }
.seg button {
  border: none; background: transparent; border-radius: 980px; padding: 6px 14px;
  font-size: 13px; cursor: pointer; color: var(--text);
}
.seg button.on { background: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* 滑块 */
input[type=range] { width: 100%; accent-color: var(--blue); }
.range-row { display: flex; align-items: center; gap: 12px; }
.range-row .val { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 52px; text-align: right; }

/* ---------------- 徽章 ---------------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 3px 9px; border-radius: 980px;
  background: #e8e8ed; color: var(--muted); font-weight: 500; white-space: nowrap;
}
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.warn { background: var(--orange-soft); color: var(--orange); }
.badge.err { background: var(--red-soft); color: var(--red); }
.badge.info { background: var(--blue-soft); color: var(--blue); }
.badge.tier { background: #f0f0f5; color: var(--muted); }

/* 数据溯源标记 */
.src {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; color: var(--muted-2); margin-left: 5px; vertical-align: middle;
}
.src::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); display: inline-block; }
.src.model::before { background: var(--orange); }
.src.none::before { background: var(--line); }

/* ---------------- 表格 ---------------- */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
  padding: 10px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap;
}
.table td { padding: 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.table tbody tr:hover { background: #fafafc; }
.table .num { font-variant-numeric: tabular-nums; }
.tbl-scroll { overflow-x: auto; }

/* 球员行 */
.p-row { display: flex; align-items: center; gap: 12px; min-width: 240px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; background: #e8e8ed;
  object-fit: cover; flex: none; display: block;
}
.p-name { font-weight: 600; font-size: 14px; }
.p-sub { font-size: 12px; color: var(--muted); }

/* 适配度 */
.score-wrap { display: flex; align-items: center; gap: 10px; min-width: 130px; }
.score-num { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 34px; }
.bar { height: 6px; border-radius: 3px; background: #e8e8ed; overflow: hidden; flex: 1; min-width: 56px; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--blue); }
.bar.g > i { background: var(--green); }
.bar.o > i { background: var(--orange); }
.bar.r > i { background: var(--red); }

/* 维度条 */
.dim { margin-bottom: 12px; }
.dim-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.dim-head .v { font-variant-numeric: tabular-nums; color: var(--muted); }

/* 提示框 */
.note {
  border-radius: var(--radius-sm); padding: 14px 16px; font-size: 13px; line-height: 1.6;
  background: var(--orange-soft); color: #7a4a06; border-left: 3px solid var(--orange);
}
.note.blue { background: var(--blue-soft); color: #0a4b8f; border-left-color: var(--blue); }
.note.gray { background: #f0f0f5; color: var(--muted); border-left-color: var(--line); }

/* 空状态 */
.empty { text-align: center; padding: 56px 20px; color: var(--muted); }
.empty h3 { margin-bottom: 8px; color: var(--text); }

/* 页脚 */
.foot {
  border-top: 1px solid var(--line-soft); margin-top: 64px; padding: 28px 0 48px;
  font-size: 12px; color: var(--muted-2);
}
.foot a { color: var(--muted); }

/* 加载 */
.spinner {
  width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--blue);
  border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ================= 球场 + 控制栏 双列布局（手机自动堆叠） ================= */
.pitch-grid {
  display: grid; gap: 16px; grid-template-columns: 300px 1fr; align-items: start;
}
.pitch-grid > * { min-width: 0; }
@media (max-width: 720px) {
  .pitch-grid { grid-template-columns: 1fr; }
}

/* ================= 球场阵型可视化 ================= */
.pitch {
  position: relative; width: 100%; aspect-ratio: 68 / 105;
  background: linear-gradient(180deg, #2f7d3a 0%, #276b33 50%, #2f7d3a 100%);
  border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
}
.pitch::before {
  content: ""; position: absolute; inset: 4%;
  border: 1.5px solid rgba(255,255,255,.42); border-radius: 6px;
}
.pitch::after {
  content: ""; position: absolute; left: 4%; right: 4%; top: 50%;
  height: 1.5px; background: rgba(255,255,255,.42);
}
.pitch-circle {
  position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1;
  transform: translate(-50%, -50%); border: 1.5px solid rgba(255,255,255,.42); border-radius: 50%;
}
.pitch-box {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: 46%; height: 13%; border: 1.5px solid rgba(255,255,255,.42); border-radius: 3px;
}
.pitch-box.top { top: 4%; }
.pitch-box.bottom { bottom: 4%; }
.slot {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: default; z-index: 2;
}
.slot .dot {
  width: 34px; height: 34px; border-radius: 50%;
  background: #fff; color: var(--text); font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.28); border: 2px solid rgba(255,255,255,.9);
}
.slot .dot.ok { background: #fff; }
.slot .dot.thin { background: #ffd28a; }
.slot .dot.empty { background: #ff9aa5; }
.slot .lbl { font-size: 10px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; }

/* ================= 攻守站位切换 ================= */
.phase-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.phase-seg button { border: 0; background: transparent; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
.phase-seg button.active { background: var(--blue); color: #fff; }
.pitch.defensive { background: linear-gradient(180deg, #2a4d70 0%, #223e5a 50%, #2a4d70 100%); }
.pitch.defensive .dot { border-color: rgba(120,170,220,.9); }
.pitch.editing { cursor: crosshair; }

/* ================= 自定义阵型编辑器 ================= */
.slot.drag { cursor: grab; }
.slot.drag:active { cursor: grabbing; }
.slot.drag .dot { background: #fff; border-color: #3ba55c; }
.editor-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.editor-bar .chip { border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; background: #fff; }
.editor-bar .chip.selected { background: var(--blue); color: #fff; border-color: var(--blue); }
.pitch .drop-zone { position: absolute; width: 20px; height: 20px; border: 2px dashed rgba(255,255,255,.8); border-radius: 50%; transform: translate(-50%,-50%); }

/* ================= 槽位矩阵中文名 ================= */
.slot-tbl .holder { display: inline-flex; align-items: center; gap: 6px; }
.slot-tbl .holder .cn { color: var(--text); font-weight: 600; }
.slot-tbl .holder .en { color: var(--muted); font-size: 11px; }

/* ================= 覆盖率可视化 ================= */
.cov { display: flex; flex-direction: column; gap: 9px; }
.cov-row { display: grid; grid-template-columns: 118px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.cov-row .lb { color: var(--text); }
.cov-track { height: 8px; background: #ececf1; border-radius: 4px; overflow: hidden; }
.cov-track > i { display: block; height: 100%; border-radius: 4px; background: var(--green); }
.cov-track > i.mid { background: var(--orange); }
.cov-track > i.low { background: var(--red); }
.cov-track > i.none { background: var(--line); width: 100% !important; }
.cov-row .pc { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; font-size: 12px; }

/* 溯源表 */
.prov td { font-size: 13px; }
.prov .kind { font-size: 10.5px; padding: 2px 7px; border-radius: 980px; white-space: nowrap; }
.kind.real { background: var(--green-soft); color: var(--green); }
.kind.derived { background: var(--blue-soft); color: var(--blue); }
.kind.model { background: var(--orange-soft); color: var(--orange); }
.kind.none { background: #f0f0f5; color: var(--muted-2); }

/* 环形图（完整度） */
.donut { display: flex; align-items: center; gap: 18px; }
.donut svg { flex: none; }
.donut-legend { font-size: 13px; color: var(--muted); }
.donut-legend b { color: var(--text); }

/* 俱乐部选择列表 */
.club-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border: 1px solid var(--line-soft); border-radius: var(--radius-sm); cursor: pointer; background: #fff;
}
.club-item:hover { border-color: var(--blue); background: var(--blue-soft); }
.club-item.on { border-color: var(--blue); background: var(--blue-soft); }
.club-item img { width: 30px; height: 30px; object-fit: contain; flex: none; }

/* 槽位需求表 */
.slot-tbl td, .slot-tbl th { font-size: 13px; }
.trait { font-size: 11.5px; color: var(--muted); }

/* ================= 阵容分组（身份页） ================= */
.roster-group { border: 1px solid var(--line-soft); border-radius: var(--radius-sm); margin-top: 12px; overflow: hidden; }
.roster-group-head {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: #fafafc; cursor: pointer; user-select: none;
}
.roster-group-head:hover { background: #f3f3f7; }
.roster-group-head .roster-arrow { margin-left: auto; color: var(--muted-2); font-size: 13px; }
.roster-group .table { background: #fff; }
.roster-group .table th { border-top: 1px solid var(--line-soft); }
@media (max-width: 720px) {
  .roster-group-head { padding: 9px 12px; }
  .roster-group .tbl-scroll { max-width: 100%; }
}

</style>
</head>
<body>
<div id="nav"></div>

<section class="wrap section" id="main">
  <div class="empty"><span class="spinner"></span> 载入球员档案…</div>
</section>

<div id="foot"></div>
<script>
/* ============================================================
   common.js —— 前端公共层：接口调用、战术画像、数据溯源标记
   约定：所有展示的数值必须区分「真实数据」与「模型计算」，
        缺失数据一律显示"暂无数据"，严禁占位造假。
   ============================================================ */
'use strict';

const NAV = [
  ['index.html', '我的身份'],
  ['overview.html', '总览'],
  ['tactical.html', '战术体系'],

/* ---------- 后端地址（必须先声明：下方守卫在脚本加载时就会用到） ---------- */
let API_BASE = '';
let _baseTask = null;
/* 已发布的完整版后端（GitHub Pages 等纯静态托管时，数据接口从这里取；
   该服务已开启 CORS，跨域直连可用） */
const REMOTE_API = 'https://scout-system.app.workbuddy.host';
const API_CANDIDATES = (function () {
  const host = location.hostname;
  const port = location.port;
  const sameOrigin = (host === 'localhost' || host === '127.0.0.1') &&
    (port === '8080' || port === '' || port === '80');
  if (sameOrigin && location.protocol !== 'file:') return ['', 'http://localhost:8080', 'http://127.0.0.1:8080', REMOTE_API];
  /* 非同源（如 GitHub Pages）：优先直连已发布的完整版后端，
     再试本机后端，最后同源相对路径兜底 */
  return [REMOTE_API, 'http://localhost:8080', 'http://127.0.0.1:8080', ''];
})();

/* ---------- 后端连通性守卫 ----------
   页面若被静态打开（直接双击 html / 静态预览托管），/api 接口不存在，
   所有请求都会 404。这里主动检测并给出可操作的修复指引，
   而不是让用户面对一堆看不懂的"接口错误 404"。
   提示使用内联样式，确保样式表未加载时依然可见。 */
let BACKEND_OK = null;
function showBackendBanner(err) {

    (err ? '（' + esc(err) + '）' : '') + '。<br>' +

function showLocalBanner(n) {

(async function checkBackend() {
  const okFound = await ensureBase();
  if (okFound) { BACKEND_OK = true; return; }
  BACKEND_OK = false;
  const db = await localDb();
  if (db && db.length) { showLocalBanner(db.length); return; }

})();

/* ---------- 后端地址自动定位 ----------
   页面可能以三种方式打开：
     1) http://localhost:8080  —— 同源，直接用相对路径
     2) 静态预览托管（如 127.0.0.1:57214/static-html/...）—— /api 会 404
     3) 直接双击 html（file://）—— /api 会 404
   这里依次探测候选地址，找到真正能用的后端就用它，
   服务端已开启 CORS，因此跨域直连同样可用。 */
function ensureBase() {
  if (API_BASE !== '' || _baseTask) return _baseTask || Promise.resolve(true);
  _baseTask = (async () => {
    for (const b of API_CANDIDATES) {
      try {
        const r = await fetch(b + '/api/health', { headers: { 'Accept': 'application/json' } });
        if (!r.ok) continue;
        const j = await r.json();
        if (j && j.ok !== false) { API_BASE = b; return true; }
      } catch (e) { /* 换下一个候选地址 */ }
    }
    return false;
  })();
  return _baseTask;
}

/* ---------- 本地真实索引兜底 ----------
   后端不可达时（服务没启动 / 静态打开），直接读取本地真实索引文件，
   保证页面依然展示真实球员，而不是一片空白。
   索引内容是此前联网抓取积累的真实数据，不是编造数据。 */
let _dbTask = null;
function localDb() {
  if (_dbTask) return _dbTask;
  const urls = [];
  if (API_BASE) urls.push(API_BASE + '/data/players.json');
  urls.push('data/players.json', './data/players.json', '/data/players.json');
  if (!API_BASE) urls.push('http://localhost:8080/data/players.json');
  _dbTask = (async () => {
    for (const u of urls) {
      try {
        const r = await fetch(u);
        if (!r.ok) continue;
        const j = await r.json();
        const raw = Array.isArray(j) ? j : (j && j.players) || null;
        if (!raw) continue;
        const arr = Array.isArray(raw) ? raw : Object.values(raw);
        if (arr.length) return arr;
      } catch (e) { /* 换下一个候选 */ }
    }
    return null;
  })();
  return _dbTask;
}

const norm = s => String(s == null ? '' : s).toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function localMatch(p, kw) {
  if (!kw) return true;
  const k = norm(kw);
  return norm(p.name).includes(k) || norm(p.nameAlt).includes(k) ||
    norm(p.team).includes(k) || norm(p.nationality).includes(k) ||
    norm(p.positionCn).includes(k);
}

async function localFallback(p, opt) {
  const [pathname, queryStr] = String(p).split('?');
  const qs = new URLSearchParams(queryStr || '');
  const db = await localDb();
  if (!db) return undefined;

  if (pathname === '/api/health') {
    return {
      ok: true, players: db.length, leagues: null, teams: null,
      indexUpdatedAt: null, primarySource: '本地真实索引（后端未连接）',
      note: '后端服务未启动，当前展示本地索引中此前联网抓取的真实数据'
    };
  }

  if (pathname === '/api/players') {
    let list = db.filter(x => localMatch(x, qs.get('q')));
    const pos = qs.get('pos');
    if (pos && pos !== 'ANY') list = list.filter(x => x.position === pos);
    const league = qs.get('league');
    if (league) list = list.filter(x => norm(x.league).includes(norm(league)));
    const aMin = qs.get('ageMin'), aMax = qs.get('ageMax');
    if (aMin != null && aMin !== '') list = list.filter(x => x.age == null || x.age >= +aMin);
    if (aMax != null && aMax !== '') list = list.filter(x => x.age == null || x.age <= +aMax);
    const total = list.length;
    const limit = Math.min(Number(qs.get('limit')) || 50, 200);
    const offset = Number(qs.get('offset')) || 0;
    return { ok: true, total, offset, limit, liveAdded: 0, dataMode: 'index', players: list.slice(offset, offset + limit) };
  }

  if (pathname === '/api/player') {
    const id = qs.get('id');
    const hit = db.find(x => String(x.id) === String(id));
    if (!hit) return undefined;
    return { ok: true, player: hit, fit: null, cached: true, dataMode: 'index' };
  }

  if (pathname === '/api/stats') {
    const byPos = {}, byLeague = {}, byNat = {};
    for (const x of db) {
      if (x.positionCn) byPos[x.positionCn] = (byPos[x.positionCn] || 0) + 1;
      const lg = x.leagueCn || x.league || '未知';
      byLeague[lg] = (byLeague[lg] || 0) + 1;
      if (x.nationality) byNat[x.nationality] = (byNat[x.nationality] || 0) + 1;
    }
    const ages = db.map(x => x.age).filter(a => a != null);
    return {
      ok: true, total: db.length, withAge: ages.length,
      avgAge: ages.length ? +(ages.reduce((a, b) => a + b, 0) / ages.length).toFixed(1) : null,
      byPos, byLeague, byNat
    };
  }

  if (pathname === '/api/search') {
    let body = {};
    try { body = JSON.parse((opt && opt.body) || '{}'); } catch (e) { }
    const f = body.filters || {};
    const kw = f.q || qs.get('q');
    let list = db.filter(x => localMatch(x, kw));
    if (f.pos && f.pos !== 'ANY') list = list.filter(x => x.position === f.pos);
    if (f.ageMin != null && f.ageMin !== '') list = list.filter(x => x.age == null || x.age >= +f.ageMin);
    if (f.ageMax != null && f.ageMax !== '') list = list.filter(x => x.age == null || x.age <= +f.ageMax);
    const size = Math.min(Number(body.size) || 30, 200);
    const page = Number(body.page) || 0;
    /* 适配度依赖服务端画像模型，本地兜底不估算，留空 */
    const scored = list.map(player => ({ player, fit: null }));
    return {
      ok: true, total: scored.length, page, size, liveAdded: 0,
      dataMode: 'index', confidence: null, players: scored.slice(page * size, page * size + size)
    };
  }

  if (pathname === '/api/clubs') {
    const kw = norm(qs.get('q'));
    const map = new Map();
    for (const x of db) {
      if (!x.team) continue;
      if (kw && !norm(x.team).includes(kw)) continue;
      if (!map.has(x.team)) map.set(x.team, { id: x.teamId, name: x.team, league: x.league || null, leagueCn: x.leagueCn || null, inIndex: true, squadSize: 0 });
      const t = map.get(x.team);
      t.squadSize++;
    }
    return { ok: true, clubs: Array.from(map.values()).slice(0, 20), dataMode: 'index' };
  }

  return undefined;   // 其余接口无法本地兜底
}

async function req(p, opt) {
  const okBase = await ensureBase();
  if (okBase) {
    const r = await fetch(API_BASE + p, opt);
    if (r.status === 404) throw new Error('接口不存在（404）：' + p);
    if (!r.ok) throw new Error('接口错误 ' + r.status);
    return r.json();
  }
  const fb = await localFallback(p, opt);
  if (fb === undefined) {
    throw new Error('后端未连接，且该请求无法用本地索引兜底：' + p +
      '。请在项目目录双击 start.bat 后访问 http://localhost:8080');
  }
  return fb;
}

/* 页面调用时传的是完整路径（如 /api/health），这里不能再补 /api。
   补一次也不行的原因：历史上曾写成 '/api' + p，导致 /api/api/... 全部 404。
   这里做幂等处理：已经是 /api 开头就直接用，否则才补。 */
const apiPath = p => (String(p).startsWith('/api') ? String(p) : '/api' + String(p));

const api = {
  async get(p) {
    return req(apiPath(p), { headers: { 'Accept': 'application/json' } });
  },
  async post(p, body) {
    return req(apiPath(p), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
  },
  async del(p) {
    return req(apiPath(p), { method: 'DELETE' });
  }
};

/* ---------- 工具 ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = s => encodeURIComponent(String(s == null ? '' : s));
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const num = v => (v == null ? null : Number(v));

/* 缺失数据显示：统一用这个，禁止用 0 或随机值代替 */
const NA = '<span class="muted">暂无数据</span>';
function val(v, suffix) {
  if (v == null || v === '' || (typeof v === 'number' && isNaN(v))) return NA;
  return esc(v) + (suffix ? '<span class="muted small">' + suffix + '</span>' : '');
}

/* ---------- 实时联网状态标记 ----------
   live    = 本次请求真实联网取回，值为数据源当前值
   cached  = 联网失败，展示上次联网成功获取的真实数据（带获取时间）
   offline = 无任何真实数据，系统留空不填充
   index   = 本地真实索引（历史联网抓取积累，非本次实时）            */
function liveBadge(mode, fetchedAt, error) {
  const map = {
    live: ['ok', '实时联网'],
    cached: ['warn', '联网失败 · 上次真实数据'],
    offline: ['err', '无数据'],
    index: ['info', '本地索引']
  };
  const m = map[mode] || map.index;
  const t = fetchedAt ? new Date(fetchedAt).toLocaleString('zh-CN') : null;
  const tip = mode === 'live' ? '本次请求直接向数据源联网取回，未使用任何缓存副本'
    : mode === 'cached' ? '联网失败（限流/超时），展示上次联网获取的真实数据，未做任何填充'
      : mode === 'offline' ? '数据源与本地均无该记录，系统留空而不编造'
        : '本地真实索引（历史联网抓取积累）';
  return `<span class="badge ${m[0]}" title="${esc(tip)}${error ? '｜' + esc(error) : ''}">${m[1]}</span>` +
    (t ? `<span class="small muted">${esc(t)}</span>` : '');
}

/* 数据溯源标记：real=真实数据 / model=模型计算 / none=无数据源 */
function src(kind, text) {
  const map = { real: '真实', model: '模型', none: '无源' };
  const cls = kind === 'real' ? '' : (kind === 'model' ? 'model' : 'none');
  return `<span class="src ${cls}" title="${esc(text || '')}">${map[kind] || ''}</span>`;
}

function scoreBar(v, invert) {
  if (v == null) return `<span class="muted small">—</span>`;
  const cls = invert ? (v >= 70 ? 'r' : v >= 40 ? 'o' : 'g') : (v >= 75 ? 'g' : v >= 55 ? '' : v >= 40 ? 'o' : 'r');
  return `<div class="score-wrap"><span class="score-num">${Math.round(v)}</span>
    <span class="bar ${cls}"><i style="width:${Math.max(2, Math.min(100, v))}%"></i></span></div>`;
}

function riskLevel(p) {
  const risks = [];
  let score = 0;
  if (p.age == null) { risks.push('出生日期缺失，无法评估年龄与成长曲线'); score += 25; }
  else {
    if (p.age >= 33) { risks.push(`年龄 ${p.age} 岁，已过该位置常规巅峰期，转售价值与伤病风险上升`); score += 30; }
    else if (p.age >= 31) { risks.push(`年龄 ${p.age} 岁，接近巅峰期末段`); score += 15; }
    else if (p.age <= 19) { risks.push(`年龄 ${p.age} 岁，职业样本量有限，存在成材不确定性`); score += 12; }
  }
  if (!p.positionRaw) { risks.push('数据源未提供位置信息，战术适配为保守估值'); score += 20; }
  if (!p.team) { risks.push('数据源未提供现所属俱乐部'); score += 15; }
  if (!p.nationalityEn) { risks.push('国籍信息缺失'); score += 8; }
  if (p.signingFee && /free|免费/i.test(p.signingFee)) risks.push('最近一次为自由转会加盟');
  const level = score >= 40 ? ['高', 'err'] : score >= 20 ? ['中', 'warn'] : ['低', 'ok'];
  return { level: level[0], cls: level[1], score, risks };
}

  const img = p.image ? `<img src="${esc(p.image)}" alt="" style="width:112px;height:112px;border-radius:50%;object-fit:cover;background:#e8e8ed">`
    : `<div style="width:112px;height:112px;border-radius:50%;background:#e8e8ed"></div>`;

  /* 数据完整度：统计真实字段的缺失情况 */
  const fields = [
    ['姓名', p.name], ['位置', p.positionRaw], ['出生日期', p.birthDate], ['国籍', p.nationalityEn],
    ['俱乐部', p.team], ['联赛', p.league], ['球衣号', p.number], ['签约日期', p.signedDate]
  ];
  const missing = fields.filter(f => !f[1]).map(f => f[0]);

  main.innerHTML = `
  <div class="between">
    <div class="row" style="gap:20px">
      ${img}
      <div>
        <div class="eyebrow">球员档案 · 真实数据</div>
        <h1>${esc(p.name || '未知球员')}</h1>
        <div class="row mt8" style="gap:6px">
          <span class="badge">${esc(p.positionCn || '位置未知')}</span>
          <span class="badge">${p.age != null ? p.age + ' 岁' : '年龄未知'}</span>
          <span class="badge">${esc(p.nationality || '国籍未知')}</span>
          ${p.team ? `<span class="badge info">${esc(p.team)}</span>` : ''}
          ${p.leagueCn ? `<span class="badge tier">${esc(p.leagueCn)}</span>` : ''}
          ${liveBadge(r.dataMode, r.fetchedAt, r.error)}
        </div>
        <div class="small muted mt8">来源 ${esc(p.source)} · 抓取时间 ${new Date(p.fetchedAt || Date.now()).toLocaleString('zh-CN')}</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="liveBtn" title="重新向数据源发起一次真实请求，取回当前最新值">重新联网获取</button>
      <button class="btn" id="addBtn">加入目标清单</button>
      <a class="btn ghost" href="deal.html?id=${esc(p.id)}">转会测算</a>
    </div>
  </div>

  ${r.dataMode === 'cached' ? `<div class="note warn">本次联网失败（${esc(r.error || '数据源限流或超时')}），以下为上次联网获取的真实数据，未做任何估算填充。</div>` : ''}
  ${r.dataMode === 'live' ? `<div class="note ok">以上字段为本次请求实时联网取回的数据源当前值。</div>` : ''}

  <div class="grid g2 mt32" style="align-items:start">
    <div class="card">
      <h3>基础信息</h3>
      <table class="table mt8">
        ${fieldRow('姓名', val(p.name), 'real')}
        ${fieldRow('别名', val(p.nameAlt), 'real')}
        ${fieldRow('位置', val(p.positionCn) + (p.positionRaw ? `<span class="muted small">　${esc(p.positionRaw)}</span>` : ''), 'real')}
        ${fieldRow('出生日期', val(p.birthDate), 'real')}
        ${fieldRow('年龄', val(p.age, ' 岁'), 'real')}
        ${fieldRow('国籍', val(p.nationality), 'real')}
        ${fieldRow('出生地', val(p.birthLocation), 'real')}
        ${fieldRow('现所属', val(p.team), 'real')}
        ${fieldRow('联赛', val(p.leagueCn || p.league), 'real')}
        ${fieldRow('球衣号', val(p.number), 'real')}
        ${fieldRow('签约日期', val(p.signedDate), 'real')}
        ${fieldRow('加盟方式', val(p.signingFee), 'real')}
        ${fieldRow('国家队', p.nationalTeam ? '<span class="badge ok">现役国脚</span>' : NA, 'real')}
        ${fieldRow('身高', val(p.height, ' cm'), 'real')}
        ${fieldRow('体重', val(p.weight, ' kg'), 'real')}
        ${fieldRow('出生地', val(p.birthPlace || p.birthLocation), 'real')}
        ${fieldRow('加盟日期', val(p.joinDate), 'real')}
        ${fieldRow('官方出场数', val(p.appearances, ' 场'), 'real')}
        ${fieldRow('零封 / 扑救', p.cleanSheets != null || p.saves != null
          ? val(p.cleanSheets, ' 零封') + '　' + val(p.saves, ' 次扑救') : NA, 'real')}
        ${fieldRow('租借身份', p.loan == null ? NA : (p.loan ? '<span class="badge info">租借在队</span>' : '<span class="badge">永久在队</span>'), 'real')}
        ${fieldRow('身价', NA + '<div class="small muted">德转无开放接口且有反爬校验，无法抓取，故不显示</div>', 'none')}
        ${fieldRow('周薪 / 年薪', NA + '<div class="small muted">非公开商业信息，无权威公开源</div>', 'none')}
        ${fieldRow('合同到期', NA + '<div class="small muted">无开放数据源</div>', 'none')}
        ${fieldRow('伤病记录', NA + '<div class="small muted">无开放数据源，不做推测</div>', 'none')}
      </table>
      ${p.seasonStats ? `<div class="note mt16"><b>赛季技术统计（${esc(p.seasonStatsLabel || '')}）</b>
        <div class="small mt8">${Object.entries(p.seasonStats).slice(0, 12).map(([k, v]) => k + ': ' + v).join('　·　')}</div></div>` : ''}
    </div>

    <div>
      <div class="card">
        <h3>体系适配度 <span class="muted small">（模型计算）</span></h3>
        <div class="small muted mt8">依据画像：${esc(P.formation)} · ${STYLE_CN[P.style] || P.style} · 压迫 ${P.press}/5</div>
        ${fit ? `
          <div class="row mt16" style="gap:20px;align-items:center">
            <div><div class="metric">${fit.total != null ? fit.total : '—'}</div><div class="metric-note">综合适配度</div></div>
            <div style="flex:1;min-width:160px">
              <div class="small muted">结果置信度 ${fit.confidence}%</div>
              <div class="bar mt8"><i style="width:${fit.confidence}%"></i></div>
              <div class="small muted mt8">置信度 = 已有数据维度权重占比</div>
            </div>
          </div>
          <div class="mt24">
            ${[['技术适配', fit.dims.tech, '位置契合 + 联赛竞技水平'],
               ['战术适配', fit.dims.tact, '打法风格 × 位置角色'],
               ['风格适配', fit.dims.style, '年龄曲线 vs 建队取向'],
               ['薪资适配', fit.dims.salary, '需薪资数据源']].map(([k, v, d]) => `
              <div class="dim">
                <div class="dim-head"><span>${k} ${src(v == null ? 'none' : 'model', d)}</span>
                  <span class="v">${v == null ? '暂无数据' : Math.round(v)}</span></div>
                <div class="bar"><i style="width:${v == null ? 0 : Math.max(2, Math.min(100, v))}%;background:${v == null ? '#d2d2d7' : 'var(--blue)'}"></i></div>
                <div class="small muted mt8" style="font-size:11.5px">${d}</div>
              </div>`).join('')}
          </div>
          ${fit.gaps && fit.gaps.length ? `<div class="note mt16"><b>数据缺口</b><ul style="margin:6px 0 0 18px;padding:0">${fit.gaps.map(g => '<li>' + esc(g) + '</li>').join('')}</ul></div>` : ''}
        ` : `<div class="note mt16">尚未配置战术画像，<a href="tactical.html">先完成体系配置</a>后即可生成适配度。</div>`}
      </div>

      <div class="card mt16">
        <h3>风险画像</h3>
        <div class="row mt16" style="gap:16px">
          <span class="badge ${risk.cls}" style="font-size:13px;padding:5px 14px">风险等级：${risk.level}</span>
          <span class="small muted">风险分 ${risk.score} / 100（基于真实字段推导）</span>
        </div>
        <ul class="small mt16" style="margin:0;padding-left:18px;line-height:1.8">
          ${risk.risks.length ? risk.risks.map(x => '<li>' + esc(x) + '</li>').join('') : '<li>未发现基于现有数据的风险项</li>'}
        </ul>
        <div class="note gray mt16">伤病历史、纪律记录、职业态度等维度需接入专业数据源后补充，当前不做推测。</div>
      </div>
    </div>
  </div>

  <div class="grid g2 mt16" style="align-items:start">
    <div class="card">
      <h3>数据溯源与交叉核对</h3>
      <p class="small muted mt8">以下为数据源提供的外部权威编号，可跳转原站人工复核，确保数据可验证、不可篡改。</p>
      <table class="table mt8">
        ${fieldRow('数据源', esc(p.source), 'real')}
        ${fieldRow('数据源页', p.sourceUrl ? `<a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">打开原始记录</a>` : NA, 'real')}
        ${fieldRow('Transfermarkt ID', val(p.transfermarktId), 'real')}
        ${fieldRow('API-Football ID', val(p.apiFootballId), 'real')}
        ${fieldRow('Wikidata ID', val(p.wikidataId), 'real')}
      </table>
      <div class="note gray mt16">缺失字段 ${missing.length ? '：<b>' + esc(missing.join('、')) + '</b>' : '：无'}。系统对缺失字段统一留空，不做填充。</div>
    </div>
    <div class="card">
      <h3>球员简介</h3>
      <div class="small mt8" style="max-height:260px;overflow:auto;line-height:1.7">
        ${p.description ? esc(p.description).replace(/\r?\n/g, '<br>') : '<span class="muted">数据源未提供简介</span>'}
      </div>
      ${p.description ? `<div class="small muted mt8">以上内容来自数据源原文，未经改写</div>` : ''}
    </div>
  </div>

  <div class="card mt16">
    <h3>懂球帝资料 <span class="muted small">（实时联网 · 中文名 / 转会 / 伤病 / 赛季数据 / 技术特点）</span></h3>
    <p class="small muted mt8">懂球帝（dongqiudi.com）是国内足球数据平台。以下字段从其球员详情接口实时抓取，缺则留空、绝不编造；未收录球员请手动输入其懂球帝 person_id 查询。</p>
    <div id="dqdBox" class="mt8"><span class="muted">加载中…</span></div>
  </div>

  <div class="card mt16">
    <h3>权威核对入口 <span class="muted small">（身价 / 薪资 / 伤病请在此核对）</span></h3>
    <p class="small muted mt8">身价、薪资、伤病这三类数据没有任何开放接口，系统不抓取、不估算。以下为该球员在权威站点的直达入口，可人工核对最新值。</p>
    <div id="authBox" class="mt8"><span class="muted">加载中…</span></div>
  </div>

  <div class="card mt16">
    <h3>相似球员（以人找人）</h3>
    <div id="simBox" class="mt8 small muted">加载中…</div>
  </div>
  `;

  /* 懂球帝资料（实时联网，按英文名映射 person_id；未收录则提示手动查询） */
  (async () => {
    const box = document.getElementById('dqdBox');
    if (!box) return;
    const renderDqd = (d) => {
      const marketYears = d.marketHistory && typeof d.marketHistory === 'object' ? Object.keys(d.marketHistory) : [];
      const latestMarket = marketYears.length ? (() => {
        const y = marketYears[marketYears.length - 1];
        const arr = d.marketHistory[y];
        const last = Array.isArray(arr) && arr.length ? arr[arr.length - 1] : null;
        return last && (last.market_value_text || (last.market_value != null ? last.market_value + ' 万欧' : null));
      })() : null;
      const charRows = [];
      if (d.character) {
        const st = (d.character.styles || []).join('、');
        const strong = ((d.character.strength && d.character.strength.strong) || []).concat((d.character.strength && d.character.strength.very_strong) || []);
        const weak = ((d.character.weakness && d.character.weakness.weak) || []).concat((d.character.weakness && d.character.weakness.very_weak) || []);
        if (st) charRows.push(`<div class="small"><b>风格</b>：${esc(st)}</div>`);
        if (strong.length) charRows.push(`<div class="small"><b>强项</b>：${esc(strong.join('、'))}</div>`);
        if (weak.length) charRows.push(`<div class="small"><b>弱项</b>：${esc(weak.join('、'))}</div>`);
      }
      const transferRows = (d.transferHistory || []).slice().reverse().map(t =>
        `<tr><td class="nowrap small">${esc(t.date || '—')}</td><td class="small">${esc(t.from || '—')} → ${esc(t.to || '—')}</td><td class="small nowrap">${esc(t.fee ? t.fee + ' 万欧' : (t.type || ''))}</td></tr>`).join('');
      const injuryRows = (d.injuryHistory || []).map(x =>
        `<tr><td class="small">${esc(x.injury || '—')}</td><td class="nowrap small">${esc(x.dateFrom || '')} ~ ${esc(x.dateUntil || '')}</td>
        <td class="num small">${x.days != null ? x.days + ' 天' : '—'}</td><td class="num small">${x.gamesMissed != null ? x.gamesMissed + ' 场' : '—'}</td>
        <td class="small">${esc((x.teams || []).join('、'))}</td></tr>`).join('');
      const seasonRows = (d.careerSeasons || []).map(c =>
        `<tr><td class="small">${esc(c.team || '—')}</td><td class="nowrap small">${esc(c.startDate || '')} ~ ${esc(c.endDate || '')}</td>
        <td class="num small">${c.appearance != null ? c.appearance : '—'}</td><td class="num small">${c.goals != null ? c.goals : '—'}</td>
        <td class="num small">${c.assist != null ? c.assist : '—'}</td><td class="num small">${c.cleanSheets != null ? c.cleanSheets : '—'}</td></tr>`).join('');

      box.innerHTML = `
        <div class="row mt8" style="gap:8px;flex-wrap:wrap">
          ${d.nameCn ? `<span class="badge info">中文名：${esc(d.nameCn)}</span>` : ''}
          ${d.nationality ? `<span class="badge">${esc(d.nationality)}</span>` : ''}
          ${d.teamCn ? `<span class="badge tier">${esc(d.teamCn)}</span>` : ''}
          ${d.marketValueWan != null ? `<span class="badge">身价 ${esc((d.marketValueWan / 10000).toFixed(2))} 亿欧</span>` : ''}
          ${d.weeklySalary != null ? `<span class="badge">周薪 ${esc(d.weeklySalary)}</span>` : ''}
          ${d.contractUntil ? `<span class="badge">合同至 ${esc(d.contractUntil)}</span>` : ''}
          ${d.sourceUrl ? `<a class="btn ghost sm" href="${esc(d.sourceUrl)}" target="_blank" rel="noopener">懂球帝原始页 ↗</a>` : ''}
        </div>
        ${d.character || charRows.length ? `<div class="card mt12" style="background:var(--panel2,#f6f6f8)"><h4 class="small">技术特点</h4><div class="mt8" style="line-height:1.8">${charRows.join('') || '<span class="muted small">无</span>'}</div></div>` : ''}
        ${(d.transferHistory && d.transferHistory.length) ? `<div class="mt12"><b class="small">转会记录</b><div class="tbl-scroll mt8"><table class="table"><thead><tr><th>日期</th><th>去向</th><th>费用</th></tr></thead><tbody>${transferRows}</tbody></table></div></div>` : ''}
        ${(d.careerSeasons && d.careerSeasons.length) ? `<div class="mt12"><b class="small">每个赛季基本数据</b><div class="tbl-scroll mt8"><table class="table"><thead><tr><th>球队</th><th>起止</th><th>出场</th><th>进球</th><th>助攻</th><th>零封</th></tr></thead><tbody>${seasonRows}</tbody></table></div></div>` : ''}
        ${(d.injuryHistory && d.injuryHistory.length) ? `<div class="mt12"><b class="small">伤病记录</b><div class="tbl-scroll mt8"><table class="table"><thead><tr><th>伤情</th><th>起止</th><th>缺席天数</th><th>缺阵场次</th><th>球队</th></tr></thead><tbody>${injuryRows}</tbody></table></div></div>` : '<div class="small muted mt12">伤病记录：暂无</div>'}
        ${marketYears.length ? `<div class="small muted mt12">历年身价（${esc(marketYears.length)} 个年度，最新 ${esc(latestMarket || '—')}）</div>` : ''}
      `;
    };

    try {
      const r = await api.get('/api/dqd/person?name=' + q(p.name));
      if (r.player) renderDqd(r.player);
    } catch (e) {
      box.innerHTML = `<div class="note gray mt8">
        未收录该球员的懂球帝 person_id，或联网失败。<br>
        <span class="muted">懂球帝搜索接口需登录态，无法自动按名匹配。可到 <a href="https://www.dongqiudi.com" target="_blank" rel="noopener">懂球帝</a> 找到球员页，把网址末尾数字填入下方查询：</span>
        <div class="row mt8" style="gap:8px">
          <input id="dqdIdInput" class="input" style="max-width:180px" placeholder="如 50466810">
          <button class="btn sm" id="dqdLookup">查询</button>
        </div>
      </div>`;
      const inp = document.getElementById('dqdIdInput');
      const btn = document.getElementById('dqdLookup');
      if (inp && btn) btn.addEventListener('click', async () => {
        const v = (inp.value || '').trim();
        if (!v) return;
        btn.disabled = true; btn.textContent = '查询中…';
        try { const r2 = await api.get('/api/dqd/person?dqdId=' + q(v)); if (r2.player) renderDqd(r2.player); }
        catch (e2) { box.innerHTML = '<span class="muted">查询失败：' + esc(e2.message) + '</span>'; }
        btn.disabled = false; btn.textContent = '查询';
      });
    }
  })();

  /* 权威来源链接 */
  (async () => {
    try {
      const a = await api.get('/api/authority?id=' + q(p.id));
      document.getElementById('authBox').innerHTML =
        `<div class="row" style="gap:8px">` + a.links.map(l =>
          `<a class="btn ghost sm" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.note || '')}">${esc(l.label)} ↗</a>`
        ).join('') + `</div>
         <div class="small muted mt8">${a.links.map(l => '· ' + esc(l.label) + '：' + esc(l.note || '')).join('<br>')}</div>`;
    } catch (e) {
      const b = document.getElementById('authBox');
      if (b) b.innerHTML = '<span class="muted">加载失败：' + esc(e.message) + '</span>';
    }
  })();

  const liveBtn = document.getElementById('liveBtn');
  if (liveBtn) liveBtn.addEventListener('click', async () => {
    liveBtn.disabled = true; liveBtn.textContent = '联网获取中…';
    try { await api.get('/api/live/player?id=' + q(p.id)); location.reload(); }
    catch (e) { liveBtn.disabled = false; liveBtn.textContent = '重新联网获取'; alert('联网获取失败：' + e.message); }
  });

  document.getElementById('addBtn').addEventListener('click', async () => {
    const b = document.getElementById('addBtn');
    try {
      await api.post('/api/targets', { target: { id: p.id, name: p.name, level: 'B', stage: '初步接触', note: '' } });
      b.textContent = '已加入目标清单'; b.classList.add('gray');
    } catch (e) { alert('加入失败：' + e.message); }
  });

  try {
    const s = await api.get('/api/similar?id=' + q(p.id) + '&limit=6');
    document.getElementById('simBox').innerHTML = s.list.length
      ? `<div class="tbl-scroll"><table class="table"><tbody>${s.list.map(x => `
          <tr><td>${playerRow(x)}</td><td class="nowrap small">${esc(x.positionCn)}</td>
          <td class="num small">${val(x.age)}</td><td>${scoreBar(x.similarity)}</td>
          <td><a class="btn ghost sm" href="player.html?id=${esc(x.id)}">查看</a></td></tr>`).join('')}
        </tbody></table></div>`
      : '<span class="muted">库中暂无可比对的球员</span>';
  } catch (e) { document.getElementById('simBox').textContent = '加载失败'; }
})();
</script>
</body>
</html>
